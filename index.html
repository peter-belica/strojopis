<!doctype html>
<html lang="sk">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Strojopis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="assets/css/app.css" rel="stylesheet">
  </head>
  <body>
    <main class="app-shell">
      <section class="topbar">
        <div>
          <p class="section-kicker">Strojopis</p>
          <h1>Trening pisania</h1>
        </div>
        <div class="profile-chip" id="activeProfileChip">
          <i class="bi bi-person"></i>
          <span>Bez profilu</span>
        </div>
      </section>

      <section class="workspace">
        <aside class="side-panel">
          <div class="panel-block">
            <h2>Profil</h2>
            <form id="profileForm" class="stack-sm">
              <label class="form-label" for="profileName">Novy profil</label>
              <div class="input-group">
                <input class="form-control" id="profileName" name="profileName" autocomplete="name" placeholder="Meno alebo prezyvka">
                <button class="btn btn-primary" type="submit">
                  <i class="bi bi-person-plus"></i>
                  Vytvorit
                </button>
              </div>
            </form>
            <div class="stack-sm">
              <label class="form-label" for="profileSelect">Aktivny profil</label>
              <select class="form-select" id="profileSelect"></select>
            </div>
            <p class="helper-text" id="storageStatus">Kontrolujem cookies...</p>
          </div>

          <div class="panel-block">
            <h2>Nastavenia</h2>
            <div class="stack-sm">
              <label class="form-label" for="keyboardModel">Fyzicka klavesnica</label>
              <select class="form-select" id="keyboardModel">
                <option value="macbook-air">MacBook Air</option>
                <option value="dell-xps-2018">Dell XPS 2018</option>
              </select>
            </div>
            <div class="stack-sm">
              <label class="form-label" for="languageLayout">Jazykova sada</label>
              <select class="form-select" id="languageLayout">
                <option value="sk">Slovencina</option>
                <option value="cs">Cestina</option>
                <option value="en-us">US English</option>
                <option value="en-gb">British English</option>
                <option value="es">Spanielcina</option>
              </select>
            </div>
          </div>
        </aside>

        <section class="practice-panel">
          <div class="practice-header">
            <div>
              <p class="section-kicker">Loop 0</p>
              <h2>Spustitelna kostra</h2>
            </div>
            <button class="btn btn-outline-secondary" id="resetButton" type="button">
              <i class="bi bi-arrow-counterclockwise"></i>
              Reset
            </button>
          </div>

          <div class="typing-strip" id="typingStrip" aria-label="Riadok znakov na pisanie"></div>

          <div class="stats-row" aria-label="Zakladne metriky">
            <div>
              <span class="stat-label">Profil</span>
              <strong id="statProfile">-</strong>
            </div>
            <div>
              <span class="stat-label">Klavesnica</span>
              <strong id="statKeyboard">MacBook Air</strong>
            </div>
            <div>
              <span class="stat-label">Jazyk</span>
              <strong id="statLanguage">Slovencina</strong>
            </div>
          </div>

          <div class="keyboard-stage">
            <div class="hand-guide" aria-hidden="true">
              <div class="hand left-hand">
                <span></span><span></span><span></span><span></span><span></span>
              </div>
              <div class="hand right-hand">
                <span></span><span></span><span></span><span></span><span></span>
              </div>
            </div>
            <div class="keyboard-preview" id="keyboardPreview" aria-label="Nahlad klavesnice"></div>
          </div>
        </section>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/js-cookie@3.0.5/dist/js.cookie.min.js"></script>
    <script type="module" src="assets/js/app.js"></script>
  </body>
</html>
